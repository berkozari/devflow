name: DevFlow Docker Images

# Pull requests: verify both production Dockerfiles, never publish images.
# main: rerun both existing CI suites, then publish immutable SHA-tagged images.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devflow-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # These are the actual DEV-014 workflows, invoked as reusable workflows.
  # A failed API test, frontend test, or browser E2E blocks image publishing.
  api-ci:
    name: Reuse API CI
    uses: ./.github/workflows/api-ci.yml
    permissions:
      contents: read

  web-ci:
    name: Reuse Web CI (including browser E2E)
    uses: ./.github/workflows/web-ci.yml
    permissions:
      contents: read

  verify-images:
    name: PR Docker build - ${{ matrix.component }}
    if: github.event_name == 'pull_request'
    needs: [api-ci, web-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build production Dockerfile (no registry push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=devflow-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=devflow-${{ matrix.component }}

  publish-images:
    name: Publish GHCR - ${{ matrix.component }}
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [api-ci, web-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Define lowercase GHCR repository and immutable image tag
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Install QEMU for linux/arm64 cross-build
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR (main only)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.component }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=devflow-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=devflow-${{ matrix.component }}
