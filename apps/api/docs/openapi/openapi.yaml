openapi: 3.1.0
info:
  title: DevFlow API
  version: 1.0.0-draft
  description: 'DevFlow REST API contract derived from the submitted route, controller, schema, service and repository sources. All 42 HTTP operations in this snapshot are represented.


    JWT access tokens are returned in JSON; refresh tokens are stored in HttpOnly cookies. For unsafe requests obtain a CSRF token first and preserve associated cookies. Swagger UI remains read-only by application configuration. Response shapes reflect actual controller envelopes (not all successful responses have a message).


    Some dashboard aggregate payloads are intentionally described as JSON objects because the application has no shared DTO schemas for them; see REVIEW.md for follow-up validation.

    '
servers:
- url: /api/v1
  description: Same-origin API (recommended for local documentation)
tags:
- name: System
- name: Health
- name: Authentication
- name: CSRF
- name: Users
- name: Admin
- name: Projects
- name: Project Members
- name: Tasks
- name: Comments
- name: Activities
- name: Notifications
- name: Dashboard
paths:
  /auth/csrf-token:
    get:
      tags:
      - Authentication
      - CSRF
      summary: Obtain a CSRF token using the standard response envelope
      operationId: getAuthCsrfToken
      responses:
        '200':
          description: CSRF token returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /csrf/csrf-token:
    get:
      tags:
      - CSRF
      summary: Obtain a CSRF token using the legacy standalone response
      operationId: getStandaloneCsrfToken
      description: Existing route with a different response shape; retained for compatibility.
      responses:
        '200':
          description: CSRF token returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandaloneCsrfResponse'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /auth/register:
    post:
      tags:
      - Authentication
      summary: Register a user
      operationId: registerUser
      security:
      - csrfHeader: []
      description: The supplied CSRF token must match the session cookies established by the CSRF endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created; does not automatically sign in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/CsrfError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Log in and obtain an access token
      operationId: loginUser
      security:
      - csrfHeader: []
      description: A successful response also sets an HttpOnly refreshToken cookie with Path=/api/v1/auth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CsrfError'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /auth/refresh:
    post:
      tags:
      - Authentication
      summary: Rotate the refresh token and issue a new access token
      operationId: refreshAccessToken
      security:
      - refreshCookie: []
        csrfHeader: []
      responses:
        '200':
          description: Access token returned and refresh cookie rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CsrfError'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /auth/logout:
    post:
      tags:
      - Authentication
      summary: Revoke the refresh token family and clear the cookie when present
      operationId: logoutUser
      description: The refresh cookie is optional; a missing cookie still produces a successful logout.
      security:
      - csrfHeader: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '403':
          $ref: '#/components/responses/CsrfError'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /:
    get:
      tags:
      - System
      summary: API root
      operationId: get
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRootEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /health/live:
    get:
      tags:
      - Health
      summary: Liveness probe
      operationId: gethealthlive
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
