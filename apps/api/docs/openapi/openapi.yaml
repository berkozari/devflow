components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from login or refresh for protected endpoints.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken
      description: Browser-managed HttpOnly cookie; Swagger UI cannot set Cookie headers manually.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF token from GET /auth/csrf-token plus associated browser cookies.
  schemas:
    RegisterRequest:
      type: object
      required:
      - name
      - email
      - password
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 254
          description: Whitespace is trimmed and the value normalized to lowercase.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Whitespace is trimmed and the value normalized to lowercase.
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
    AuthenticatedUser:
      type: object
      required:
      - id
      - name
      - email
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
    RegisteredUser:
      allOf:
      - $ref: '#/components/schemas/AuthenticatedUser'
      - type: object
        required:
        - createdAt
        properties:
          createdAt:
            type: string
            format: date-time
    AuthTokenData:
      type: object
      required:
      - accessToken
      - user
      properties:
        accessToken:
          type: string
          description: Signed 15-minute JWT access token.
        user:
          $ref: '#/components/schemas/AuthenticatedUser'
    AuthTokenResponse:
      type: object
      required:
      - success
      - message
      - data
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/AuthTokenData'
    RegisterResponse:
      type: object
      required:
      - success
      - message
      - data
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
          const: User registered successfully
        data:
          $ref: '#/components/schemas/RegisteredUser'
    LogoutResponse:
      type: object
      required:
      - success
      - message
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
          const: Logout successful
    CsrfEnvelope:
      type: object
      required:
      - success
      - message
      - data
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
          const: CSRF token generated
        data:
          type: object
          required:
          - csrfToken
          properties:
            csrfToken:
              type: string
    StandaloneCsrfResponse:
      type: object
      required:
      - success
      - csrfToken
      properties:
        success:
          type: boolean
          const: true
        csrfToken:
          type: string
    ErrorResponse:
      type: object
      required:
      - success
      - message
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
    ValidationErrorResponse:
      allOf:
      - $ref: '#/components/schemas/ErrorResponse'
      - type: object
        required:
        - errors
        properties:
          errors:
            type: array
            items:
              type: object
              required:
              - field
              - message
              properties:
                field:
                  type: string
                message:
                  type: string
    Pagination:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      required:
      - page
      - limit
      - total
      - totalPages
    PublicUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
      required:
      - id
      - name
      - email
    SimpleUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    ProjectBase:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - PLANNING
          - ACTIVE
          - COMPLETED
          - ARCHIVED
        ownerId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - name
      - description
      - status
      - ownerId
      - createdAt
      - updatedAt
    ProjectListItem:
      allOf:
      - $ref: '#/components/schemas/ProjectBase'
      - type: object
        properties:
          _count:
            type: object
            properties:
              members:
                type: integer
              tasks:
                type: integer
            required:
            - members
            - tasks
        required:
        - _count
    ProjectCreate:
      allOf:
      - $ref: '#/components/schemas/ProjectListItem'
      - type: object
        properties:
          owner:
            $ref: '#/components/schemas/PublicUser'
        required:
        - owner
    ProjectMemberBase:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - OWNER
          - ADMIN
          - MEMBER
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - projectId
      - userId
      - role
      - createdAt
      - updatedAt
    ProjectMemberWithUser:
      allOf:
