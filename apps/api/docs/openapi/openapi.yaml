        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Resource not found or inaccessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimitError'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
