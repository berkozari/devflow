        properties:
          owner:
            $ref: '#/components/schemas/SimpleUser'
          members:
            type: array
            items:
              $ref: '#/components/schemas/ProjectMemberWithUser'
          _count:
            type: object
            properties:
              tasks:
                type: integer
            required:
            - tasks
        required:
        - owner
        - members
        - _count
    CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          maxLength: 1000
      required:
