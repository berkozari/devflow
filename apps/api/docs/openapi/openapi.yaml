        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 50
      - name: search
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PLANNING
          - ACTIVE
          - COMPLETED
          - ARCHIVED
      security:
      - bearerAuth: []
  /projects/{id}:
    get:
